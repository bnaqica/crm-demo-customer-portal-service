# Started automatically by `./gradlew bootRun`, and stopped again when the application exits.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: crm_demo_customer_portal_service_db
      POSTGRES_USER: crm_demo_customer_portal_service_local
      POSTGRES_PASSWORD: local
    ports:
      # A random host port, so several services can run side by side. Find it with `docker compose port postgres 5432`.
      - "127.0.0.1::5432"
    volumes:
      # From PostgreSQL 18 the volume goes here, not in /var/lib/postgresql/data
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
