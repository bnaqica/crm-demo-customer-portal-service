# Added on top of src/main/resources/application.yml for tests. The addresses here are never contacted.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/test-issuer
  kafka:
    bootstrap-servers: localhost:9   # replaced by Testcontainers in integration tests; never contacted otherwise
portal:
  storage:   # replaced by LocalStack in integration tests; never contacted otherwise
    bucket: portal-documents
    region: eu-central-1
    endpoint: http://localhost:9
    access-key: test
    secret-key: test
    upload-queue-url: http://localhost:9/000000000000/portal-uploads
  clamav:
    host: localhost   # replaced by Testcontainers in integration tests
    port: 9
  cors:
    allowed-origins: http://localhost:5174
