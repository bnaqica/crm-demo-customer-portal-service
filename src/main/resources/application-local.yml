# Settings for running on a developer machine. This profile also turns off authentication.
spring:
  # During `./gradlew bootRun` the connection comes from compose.yaml and these values aren't used.
  # They apply when the application is started some other way against a Postgres on port 5432.
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_demo_customer_portal_service_db
    username: crm_demo_customer_portal_service_local
    password: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/portal   # unused while the local profile turns authentication off
  kafka:
    bootstrap-servers: localhost:9092
portal:
  storage:   # local-docker LocalStack
    bucket: portal-documents
    region: eu-central-1
    endpoint: http://localhost:4566
    access-key: test
    secret-key: test
    upload-queue-url: http://localhost:4566/000000000000/portal-uploads
  clamav:
    host: localhost   # local-docker ClamAV
  cors:
    allowed-origins: http://localhost:5174   # the Portal UI (local-docker)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
